name: Publish to npm

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example, v1.0.0)
        required: true
        default: v1.0.0
        type: string
      mode:
        description: Use stage only for the one-time first publication
        required: true
        default: stage
        type: choice
        options:
          - stage
          - oidc

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: NPM
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${RELEASE_TAG}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Stage first publication
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'stage'
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish through npm Trusted Publishing (OIDC)
        if: github.event_name == 'release' || inputs.mode == 'oidc'
        run: npm publish --access public --tag latest
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
