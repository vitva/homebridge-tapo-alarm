name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example, v1.0.0)
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with current granular-token support
        run: npm install --global npm@11.15.0

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${RELEASE_TAG}"

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ESLINT_USE_FLAT_CONFIG: "false"
