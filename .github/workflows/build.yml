name: Build and Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.20.8, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Lint the project
        run: npm run lint
        env:
          ESLINT_USE_FLAT_CONFIG: false

      - name: Run unit tests
        run: npm test

      - name: Build the project
        run: npm run build
        env:
          CI: true

      - name: Verify the published package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const p=require('./package.json'); const files=require('./pack.json')[0].files.map(f=>f.path); if (!files.includes(p.main)) throw new Error('Package is missing its compiled entry point: '+p.main);"
          node -e "let registered; require('./dist/index.js').default({registerPlatform(name, platform) { registered={name, platform}; }}); if (registered?.name !== 'HomebridgeTapoAlarm' || typeof registered.platform !== 'function') throw new Error('Homebridge plugin entry point did not register the platform');"
