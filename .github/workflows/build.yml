name: Build and Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        homebridge-version: [1.11.4, 2.5.0]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version}}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test against Homebridge ${{ matrix.homebridge-version }}
        run: npm install --no-save --package-lock=false homebridge@${{ matrix.homebridge-version }}

      - name: Lint the project
        run: npm run lint
        env:
          ESLINT_USE_FLAT_CONFIG: "false"

      - name: Run unit tests
        run: npm test

      - name: Build CommonJS and ESM outputs
        if: matrix.homebridge-version == '1.11.4'
        run: npm run build
        env:
          CI: true

      - name: Build ESM output for Homebridge 2
        if: matrix.homebridge-version == '2.5.0'
        run: npm run build:esm
        env:
          CI: true

      - name: Verify npm package and CommonJS/ESM entry points
        if: matrix.homebridge-version == '1.11.4'
        run: |
          npm pack --dry-run --ignore-scripts --json > pack.json
          node -e "const p=require('./package.json'); const files=require('./pack.json')[0].files.map(f=>f.path); for (const f of [p.main, p.exports['.'].import, p.exports['.'].require]) { const normalized=f.replace(/^\\.\\//, ''); if (!files.includes(normalized)) throw new Error('Package is missing entry point: '+normalized); }"
          node -e "let registered; require('./dist/index.js').default({registerPlatform(name, platform) { registered={name, platform}; }}); if (registered?.name !== 'HomebridgeTapoAlarm' || typeof registered.platform !== 'function') throw new Error('CommonJS entry point did not register the platform');"
          node --input-type=module -e "import plugin from './dist-esm/index.js'; let registered; plugin({registerPlatform(name, platform) { registered={name, platform}; }}); if (registered?.name !== 'HomebridgeTapoAlarm' || typeof registered.platform !== 'function') throw new Error('ESM entry point did not register the platform');"

      - name: Verify Homebridge 2 ESM entry point
        if: matrix.homebridge-version == '2.5.0'
        run: |
          node --input-type=module -e "import plugin from './dist-esm/index.js'; let registered; plugin({registerPlatform(name, platform) { registered={name, platform}; }}); if (registered?.name !== 'HomebridgeTapoAlarm' || typeof registered.platform !== 'function') throw new Error('Homebridge 2 ESM entry point did not register the platform');"
